  history: normalized_strictly_prior_exponential
  observed_tau_fit_partition: train
  tau_estimator: pooled_within_track_adjacent_pair_OU_SSE
  cross_track_transitions: prohibited
  tau_profile_bounds: [0.0001, 0.20]
  tau_profile_grid_size: 512
  require_observed_interior_tau: true
  boundary_observed_disposition: generator4_fail_no_grid_change
screen:
