null_design:
  permutation_unit: innovation_within_complete_track_and_split
  observed_targets_unchanged: true
  recompute_tau_inside_every_null: true
  recompute_history_inside_every_null: true
  boundary_null_estimates_retained: true
  boundary_null_estimates_discarded: false
  grid_change_after_outcome: prohibited
gates:
  p_max: 0.05
  minimum_raw_fractional_improvement: 0.01
  minimum_null_adjusted_fractional_improvement: 0.01
  require_bootstrap_lower_bound_above_zero: true
  require_observed_interior_tau: true
claims:
  pass_scope: predictive_innovation_history_coordinate_beyond_frozen_AR3_baseline
  irreducible_nonlocal_memory: prohibited
  fundamental_non_markovian_dynamics: prohibited
  physical_timescale: prohibited
  universal_black_hole_M: prohibited
outputs:
